<section class="cheat-card" id="difficulty" aria-labelledby="difficulty-title">
  <h2 id="difficulty-title">Difficulty</h2>
  <p>The Director sets the required success.</p>
  <table>
    <thead><tr><th scope="col">Difficulty</th><th scope="col">Matching dice</th></tr></thead>
    <tbody>
      {{ range $index, $name := slice "Basic" "Critical" "Extreme" "Impossible" }}
      {{ $count := add $index 2 }}
      <tr>
        <th scope="row">{{ $name }}</th>
        <td><span class="matching-dice" role="img" aria-label="{{ $count }} matching dice">{{ range seq $count }}<svg class="symbol-die" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="1" y="1" width="22" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M12 4 C13.5 9 15 10.5 20 12 C15 13.5 13.5 15 12 20 C10.5 15 9 13.5 4 12 C9 10.5 10.5 9 12 4Z" fill="currentColor"/></svg>{{ end }}</span></td>
      </tr>
      {{ end }}
    </tbody>
  </table>
  <p>Critical is the default.<br>Any matching face counts.</p>
</section>
